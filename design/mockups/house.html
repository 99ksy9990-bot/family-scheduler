<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘우리 집 시안</title>
<style>
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Bold.woff2) format("woff2");font-weight:700}
:root{
 --ink:oklch(28% 0.03 265);--ink-2:oklch(50% 0.02 265);--bg:oklch(97% 0.015 85);
 --roof:oklch(62% 0.12 35);--roof-d:oklch(52% 0.12 35);--wall:oklch(99% 0.005 85);--line:oklch(88% 0.02 70);
 --dad:oklch(92% 0.04 265);--mom:oklch(93% 0.05 35);--big:oklch(93% 0.04 300);--little:oklch(94% 0.05 160);
 --dad-s:oklch(36% 0.08 265);--mom-s:oklch(56% 0.15 35);--big-s:oklch(50% 0.09 300);--little-s:oklch(48% 0.09 160);
 --sun:oklch(88% 0.14 90);--grass:oklch(84% 0.08 140);
}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);font-family:SUITE,system-ui,sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;word-break:keep-all}
.phone{width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:58px 20px 6px}
.top h1{font-size:22px;font-weight:700}
.top span{font-size:15px;color:var(--ink-2)}
.house{margin:10px 16px 0;position:relative}
.roof{height:70px;background:var(--roof);clip-path:polygon(50% 0,100% 100%,0 100%);margin:0 -8px;position:relative}
.chim{position:absolute;right:62px;top:14px;width:22px;height:40px;background:var(--roof-d)}
.rooms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;background:var(--line);padding:6px;border-radius:0 0 18px 18px}
.room{border:0;font:inherit;color:inherit;text-align:left;border-radius:12px;padding:10px 12px 12px;height:168px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:pointer}
.room:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.room img{width:96px;height:96px;position:absolute;top:8px;left:50%;transform:translateX(-50%)}
.room b{font-size:16px}
.room small{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
.r-dad{background:var(--dad)}.r-mom{background:var(--mom)}.r-big{background:var(--big)}.r-little{background:var(--little)}
.r-dad b{color:var(--dad-s)}.r-mom b{color:var(--mom-s)}.r-big b{color:var(--big-s)}.r-little b{color:var(--little-s)}
.ground{height:10px;background:var(--grass);margin:0 -16px;border-radius:0}
.next{margin:16px 16px 0;background:var(--wall);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.next img{width:44px;height:44px}
.next p{font-size:13px;color:var(--ink-2)}
.next h2{font-size:17px;font-weight:700}
.next time{margin-left:auto;font-size:20px;font-weight:700}
.later{margin:10px 16px 0;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;gap:8px;padding:0 4px}
.later div{display:flex;gap:10px}.later time{width:44px;color:var(--ink)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:84px;background:var(--wall);display:flex;justify-content:space-around;padding-top:10px;border-top:1px solid var(--line)}
.tabs a{font-size:12px;color:var(--ink-2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs a i{width:24px;height:24px;border-radius:7px;border:2px solid currentColor}
.tabs a.on{color:var(--ink);font-weight:700}.tabs a.on i{background:var(--sun);border-color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--ink)}
</style></head><body>
<div class="phone">
 <div class="top"><h1>우리 집</h1><span>11월 6일 금요일</span></div>
 <div class="house">
  <div class="roof"><div class="chim"></div></div>
  <div class="rooms">
   <button class="room r-dad"><img src="dad_busy.png" alt=""><b>아빠</b><small>근무 D 15:30까지</small></button>
   <button class="room r-mom"><img src="mom_basic.png" alt=""><b>엄마</b><small>집에 있어요</small></button>
   <button class="room r-big"><img src="big_busy.png" alt=""><b>초롱</b><small>학교 15:40까지</small></button>
   <button class="room r-little"><img src="little_basic.png" alt=""><b>연두</b><small>다음 피아노 16:00</small></button>
  </div>
 </div>
 <div class="ground"></div>
 <div class="next"><img src="little_basic.png" alt=""><div><p>다음 일정</p><h2>연두 피아노</h2></div><time>16:00</time></div>
 <div class="later"><div><time>18:00</time>초롱 영어학원</div><div><time>19:30</time>가족 저녁</div></div>
 <nav class="tabs"><a class="on" href="#"><i></i>우리 집</a><a href="#"><i></i>달력</a><a href="#"><i></i>할 일</a><a href="#"><i></i>놀이</a><a href="#"><i></i>설정</a></nav>
</div>
</body></html>
