<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 시안</title>
<style>
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Bold.woff2) format("woff2");font-weight:700}
:root{
 --font:SUITE,-apple-system,system-ui,sans-serif;
 --bg:#eef0f7;--card:rgba(255,255,255,.55);--glass-line:rgba(255,255,255,.7);--blob1:#a5b4fc;--blob2:#fdba9a;--blob3:#86efc4;--label:#000;--label-2:rgba(60,60,67,.6);--label-3:rgba(60,60,67,.3);
 --sep:rgba(60,60,67,.12);--tint:#0a84ff;--bar:rgba(249,249,249,.86);
 --dad:#5e5ce6;--mom:#ff7a59;--big:#bf5af2;--little:#30b07a;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b12;--card:rgba(40,40,48,.5);--glass-line:rgba(255,255,255,.12);--blob1:#3730a3;--blob2:#9a3412;--blob3:#065f46;--label:#fff;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--bar:rgba(22,22,24,.86)}}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);font-family:var(--font);color:var(--label);font-variant-numeric:tabular-nums;word-break:keep-all;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.phone::before,.phone::after,.blob{content:"";position:absolute;border-radius:50%;filter:blur(60px);z-index:-1;opacity:.75}
.phone::before{width:300px;height:300px;background:var(--blob1);top:-60px;left:-80px}
.phone::after{width:280px;height:280px;background:var(--blob2);top:260px;right:-100px}
.blob{width:260px;height:260px;background:var(--blob3);bottom:60px;left:-60px}
.tile,.list{backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 8px 24px rgba(30,30,60,.08)}
header{padding:58px 20px 0}
header p{font-size:15px;font-weight:600;color:var(--label-2)}
header h1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.sec{font-size:20px;font-weight:700;padding:18px 20px 8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 16px}
.tile{border:0;font:inherit;color:inherit;text-align:left;background:var(--card);border-radius:22px;padding:14px;height:140px;display:flex;flex-direction:column;position:relative;cursor:pointer}
.tile:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.tile img{width:58px;height:58px}
.tile b{font-size:17px;font-weight:700;margin-top:auto}
.tile small{font-size:13px;color:var(--label-2);margin-top:2px}
.tile .dot{position:absolute;top:16px;right:16px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff}
.d-dad{background:var(--dad)}.d-big{background:var(--big)}
.list{margin:0 16px;background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
.row img{width:32px;height:32px}
.row div{flex:1;min-width:0}
.row b{font-size:17px;font-weight:600;display:block}
.row small{font-size:13px;color:var(--label-2)}
.row time{font-size:17px;color:var(--label-2)}
.row.next time{color:var(--tint);font-weight:600}
.tabs{position:absolute;bottom:8px;left:16px;right:16px;height:62px;background:var(--card);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 8px 24px rgba(30,30,60,.12);border-radius:31px;display:flex;justify-content:space-around;align-items:center}
.tabs a{font-size:10px;font-weight:600;color:var(--label-2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px}
.tabs a.on{color:var(--tint)}
.tabs a:focus-visible{outline:2px solid var(--tint);border-radius:6px}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on svg{fill:currentColor;stroke:currentColor}
</style></head><body>
<div class="phone"><div class="blob"></div>
 <header><p>11월 6일 금요일</p><h1>우리집</h1></header>
 <div class="sec">지금</div>
 <div class="grid">
  <button class="tile"><span class="dot d-dad">근무 중</span><img src="dad_busy.png" alt=""><b>아빠</b><small>15:30까지</small></button>
  <button class="tile"><img src="mom_basic.png" alt=""><b>엄마</b><small>집</small></button>
  <button class="tile"><span class="dot d-big">학교</span><img src="big_busy.png" alt=""><b>초롱</b><small>15:40까지</small></button>
  <button class="tile"><img src="little_basic.png" alt=""><b>연두</b><small>피아노 16:00</small></button>
 </div>
 <div class="sec">오늘 남은 일정</div>
 <div class="list">
  <div class="row next"><img src="little_basic.png" alt=""><div><b>피아노</b><small>연두</small></div><time>16:00</time></div>
  <div class="row"><img src="big_basic.png" alt=""><div><b>영어학원</b><small>초롱</small></div><time>18:00</time></div>
  <div class="row"><img src="mom_basic.png" alt=""><div><b>가족 저녁</b><small>모두</small></div><time>19:30</time></div>
  <div class="row"><img src="dad_basic.png" alt=""><div><b>분리수거</b><small>아빠</small></div><time>21:00</time></div>
 </div>
 <nav class="tabs">
  <a class="on" href="#"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>우리집</a>
  <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>달력</a>
  <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg>할 일</a>
  <a href="#"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17 14h.01"/></svg>놀이</a>
  <a href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>설정</a>
 </nav>
</div>
</body></html>
