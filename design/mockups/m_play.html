<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>우리집 시안</title>
<style>
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-SemiBold.woff2) format("woff2");font-weight:600}
@font-face{font-family:SUITE;src:url(../../public/fonts/SUITE-Bold.woff2) format("woff2");font-weight:700}
:root{
 --font:SUITE,-apple-system,system-ui,sans-serif;
 --bg:#f2f2f7;--card:rgba(255,255,255,.55);--glass-line:rgba(255,255,255,.7);--blob1:#a5b4fc;--blob2:#fdba9a;--blob3:#86efc4;--label:#000;--label-2:rgba(60,60,67,.6);--label-3:rgba(60,60,67,.3);
 --sep:rgba(60,60,67,.12);--tint:#0a84ff;--bar:rgba(249,249,249,.86);
 --dad:#5e5ce6;--mom:#ff7a59;--big:#bf5af2;--little:#30b07a;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b12;--card:rgba(40,40,48,.5);--glass-line:rgba(255,255,255,.12);--blob1:#3730a3;--blob2:#9a3412;--blob3:#065f46;--label:#fff;--label-2:rgba(235,235,245,.6);--label-3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--bar:rgba(22,22,24,.86)}}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:clip}
body{background:var(--bg);font-family:var(--font);color:var(--label);font-variant-numeric:tabular-nums;word-break:keep-all;-webkit-font-smoothing:antialiased}
.phone{width:393px;height:852px;margin:0 auto;position:relative;overflow:hidden;background:var(--bg);isolation:isolate}
.tile,.list{backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 8px 24px rgba(30,30,60,.08)}
header{padding:58px 20px 0}
header p{font-size:15px;font-weight:600;color:var(--label-2)}
header h1{font-size:34px;font-weight:700;letter-spacing:-.4px;margin-top:2px}
.sec{font-size:20px;font-weight:700;padding:18px 20px 8px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:0 16px}
.tile{border:0;font:inherit;color:inherit;text-align:left;background:var(--card);border-radius:22px;padding:14px;height:140px;display:flex;flex-direction:column;position:relative;cursor:pointer}
.tile:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.tile img{width:58px;height:58px}
.tile b{font-size:17px;font-weight:700;margin-top:auto}
.tile small{font-size:13px;color:var(--label-2);margin-top:2px}
.tile .dot{position:absolute;top:16px;right:16px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;color:#fff}
.d-dad{background:var(--dad)}.d-big{background:var(--big)}
.list{margin:0 16px;background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:60px;right:0;height:.5px;background:var(--sep)}
.row img{width:32px;height:32px}
.row div{flex:1;min-width:0}
.row b{font-size:17px;font-weight:600;display:block}
.row small{font-size:13px;color:var(--label-2)}
.row time{font-size:17px;color:var(--label-2)}
.row.next time{color:var(--tint);font-weight:600}
.tabs{position:absolute;bottom:8px;left:16px;right:16px;height:62px;background:var(--card);backdrop-filter:blur(24px) saturate(1.6);-webkit-backdrop-filter:blur(24px) saturate(1.6);border:1px solid var(--glass-line);box-shadow:0 8px 24px rgba(30,30,60,.12);border-radius:31px;display:flex;justify-content:space-around;align-items:center}
.tabs a{font-size:10px;font-weight:600;color:var(--label-2);text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px}
.tabs a.on{color:var(--tint)}
.tabs a:focus-visible{outline:2px solid var(--tint);border-radius:6px}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs a.on svg{fill:currentColor;stroke:currentColor}
</style><style>
/* glass icons */
.tile,.list{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none;border:0}
.gl{position:relative;display:grid;place-items:center;border-radius:50%;
 background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(255,255,255,.35) 55%,rgba(255,255,255,.6));
 box-shadow:inset 0 1px 1px rgba(255,255,255,1),inset 0 -2px 6px rgba(0,0,0,.08),0 6px 14px var(--c,rgba(0,0,0,.12));
 border:1px solid rgba(255,255,255,.9)}
.gl::after{content:"";position:absolute;inset:3px 10% 55% 10%;border-radius:50% 50% 40% 40%;background:linear-gradient(rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.tile .gl{width:66px;height:66px;background-color:var(--t)}
.tile .gl img{width:56px;height:56px}
.c-dad{--t:rgba(94,92,230,.22);--c:rgba(94,92,230,.35)}.c-mom{--t:rgba(255,122,89,.22);--c:rgba(255,122,89,.35)}
.c-big{--t:rgba(191,90,242,.22);--c:rgba(191,90,242,.35)}.c-little{--t:rgba(48,176,122,.22);--c:rgba(48,176,122,.35)}
.tabs a i.gl{width:40px;height:40px;border-radius:14px;background-color:rgba(120,120,128,.10);--c:rgba(0,0,0,.06)}
.tabs a.on i.gl{background-color:rgba(10,132,255,.85);--c:rgba(10,132,255,.45);color:#fff}
.tabs a.on svg{fill:none;stroke:#fff}
.tabs svg{width:22px;height:22px;position:relative;z-index:1}
.tabs a{gap:2px}
.dot{box-shadow:inset 0 1px 1px rgba(255,255,255,.6),0 3px 8px rgba(0,0,0,.15)}
</style><style>.tile .gl::after{opacity:.35;inset:2px 18% 72% 18%}</style><style>.tabs a i.gl,.tabs a.on i.gl{background:none;border:0;box-shadow:none;width:30px;height:30px}.tabs a i.gl::after{display:none}.tabs a.on i.gl{color:var(--tint)}.tabs a.on svg{stroke:var(--tint);fill:none}.tabs a{color:var(--label-2)}.tabs a.on{color:var(--tint)}.tabs svg{width:26px;height:26px}</style><style>
.chips{display:flex;gap:8px;padding:0 16px 10px}
.chips span{font-size:15px;font-weight:600;padding:7px 14px;border-radius:999px;background:#fff}
.chips span.on{background:var(--tint);color:#fff}
.ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--label-3);flex:none}
.ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chev{color:var(--label-3);font-size:22px}
.gtile .gl img{width:44px;height:44px}
.sheet{position:absolute;inset:54px 0 0;background:var(--bg);border-radius:14px 14px 0 0}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.sbar a{color:var(--tint);font-size:17px;text-decoration:none}.sbar b{font-size:17px}
.inp{color:var(--label-3);font-weight:400}
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.16);position:relative;flex:none}
.sw::after{content:"";position:absolute;width:27px;height:27px;border-radius:50%;background:#fff;top:2px;left:2px;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.pill{background:rgba(120,120,128,.12);padding:6px 10px;border-radius:8px;font-size:17px}
.who{display:flex;gap:8px}.who img{width:40px;height:40px}.who img.off{filter:grayscale(1);opacity:.4}
.tag{font-size:17px;color:var(--label-2)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.3)}
</style></head><body><div class="phone">
<header><p>오늘 3판</p><h1>놀이</h1></header>
<div class="sec">게임</div><div class="grid"><button class="tile gtile"><span class="gl" style="--t:rgba(10,132,255,.1)"><img src="../characters/game/star.png" alt=""></span><b>카드 짝 맞추기</b><small>최고 12초</small></button><button class="tile gtile"><span class="gl" style="--t:rgba(10,132,255,.1)"><img src="../characters/game/dad_basket.png" alt=""></span><b>떨어지는 별 받기</b><small>최고 340점</small></button><button class="tile gtile"><span class="gl" style="--t:rgba(10,132,255,.1)"><img src="../characters/game/hole.png" alt=""></span><b>가족 얼굴 톡톡</b><small>최고 28점</small></button><button class="tile gtile"><span class="gl" style="--t:rgba(10,132,255,.1)"><img src="../characters/game/sun.png" alt=""></span><b>순서 기억하기</b><small>최고 7단계</small></button><button class="tile gtile"><span class="gl" style="--t:rgba(10,132,255,.1)"><img src="../characters/game/heart.png" alt=""></span><b>같은 그림 셋</b><small>최고 1,250점</small></button></div>
<nav class="tabs"><a href="#"><i class="gl"><svg viewBox="0 0 24 24"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></i>우리집</a><a href="#"><i class="gl"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></i>달력</a><a class="on" href="#"><i class="gl"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="5"/><path d="M8 11v3M6.5 12.5h3M15 12h.01M17 14h.01"/></svg></i>놀이</a><a href="#"><i class="gl"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 6 5"/></svg></i>가족</a></nav></div></body></html>
